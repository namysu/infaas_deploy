apiVersion: v1
kind: ServiceAccount
metadata:
  name: infaas-controller
  namespace: infaas
---
# The VM-Autoscaler discovers worker pods and, in WORKER_MODE=dynamic, creates
# and deletes them from the worker Deployments' pod templates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infaas-controller
  namespace: infaas
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infaas-controller
  namespace: infaas
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infaas-controller
subjects:
  - kind: ServiceAccount
    name: infaas-controller
    namespace: infaas
